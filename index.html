<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一個 LINE LIFF App</title>
    
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        #user-info { display: none; margin-top: 20px; }
        #avatar { width: 100px; height: 100px; border-radius: 50%; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
        #btn-login { display: none; } /* 預設隱藏，由 JS 初始化判斷後再顯示 */
    </style>
</head>
<body>

    <h1>LINE LIFF 測試小程式</h1>
    
    <button id="btn-login" onclick="liffLogin()">使用 LINE 登入</button>

    <div id="user-info">
        <h2>歡迎，<span id="user-name"></span>！</h2>
        <img id="avatar" src="" alt="用戶頭像"><br><br>
        <button onclick="sendTestMessage()">發送測試訊息</button>
        <button onclick="liffLogout()">登出</button>
    </div>

    <script>
        const MY_LIFF_ID = '2010354679-ea9avhSI'; 

        // 網頁一打開，自動執行「初始化」
        async function initLIFF() {
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                
                if (liff.isLoggedIn()) {
                    showUserInfo(); // 已登入，去抓資料
                } else {
                    // 沒登入，就把登入按鈕秀出來
                    document.getElementById('btn-login').style.display = 'inline-block';
                }
            } catch (error) {
                console.error('LIFF 初始化失敗', error);
                alert('LIFF 初始化失敗：' + JSON.stringify(error));
            }
        }

        // 抓取 LINE 資料並顯示在網頁上
        async function showUserInfo() {
            try {
                document.getElementById('btn-login').style.display = 'none'; 
                document.getElementById('user-info').style.display = 'block'; 

                const profile = await liff.getProfile();
                document.getElementById('user-name').innerText = profile.displayName; 
                document.getElementById('avatar').src = profile.pictureUrl || 'https://via.placeholder.com/100'; 
            } catch (error) {
                console.error('抓取用戶資料失敗', error);
                alert('抓取用戶資料失敗：' + JSON.stringify(error));
            }
        }

        // 按下登入按鈕時觸發
        function liffLogin() {
            try {
                if (!liff.isLoggedIn()) {
                    liff.login(); 
                }
            } catch (error) {
                alert('登入功能失敗：' + JSON.stringify(error));
            }
        }

        // 按下登出按鈕時觸發
        function liffLogout() {
            if (liff.isLoggedIn()) {
                liff.logout(); 
                window.location.reload(); 
            }
        }

        // 按下發送訊息時觸發（智慧判斷環境）
        async function sendTestMessage() {
            if (!liff.isLoggedIn()) {
                alert('請先點擊登入喔！');
                return;
            }

            // 定義要發送的訊息內容
            const messagePayload = [
                {
                    type: 'text',
                    text: '大家好！這是我從測試小程式發送的訊息 🚀'
                }
            ];

            // 情況 A：如果是在手機 LINE App 聊天室內直接打開
            if (liff.isInClient()) {
                try {
                    await liff.sendMessages(messagePayload);
                    alert('訊息已成功發送到當前聊天室！');
                } catch (error) {
                    alert('LINE 內發送失敗，請在網頁上點擊登出後重新登入授權。錯誤原因：' + JSON.stringify(error));
                }
            } 
            // 情況 B：如果是在一般瀏覽器（電腦、手機 Safari/Chrome）打開
            else {
                try {
                    // 呼叫 LINE 的分享好友/群組選擇器
                    const result = await liff.shareTargetPicker(messagePayload);
                    if (result) {
                        alert('分享成功！訊息已傳送給指定好友。');
                    } else {
                        alert('你取消了分享。');
                    }
                } catch (error) {
                    alert('瀏覽器分享失敗。如果您剛剛才勾選後台權限，請務必先在網頁按「登出」並重新登入。錯誤原因：' + JSON.stringify(error));
                }
            }
        }

        // 確保網頁載入完成後執行
        document.addEventListener("DOMContentLoaded", initLIFF);
    </script>
</body>
</html>
